# Docker Compose for Development
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: inventory-app-dev
    ports:
      - "5173:5173"
      - "5174:5174"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      # API base URL - change this to your API server
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://localhost:7071}
      NODE_ENV: development
      VITE_APP_NAME: AlMuthannaPrecast Inventory Management
      VITE_LOG_LEVEL: debug
    networks:
      - inventory-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Uncomment to run the API in Docker as well
  # api:
  #   image: almuthanna-api:latest
  #   container_name: almuthanna-api
  #   ports:
  #     - "7071:7071"
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #     - ConnectionString=Server=db;Database=almuthanna;User=sa;Password=YourPassword123
  #   networks:
  #     - inventory-network
  #   depends_on:
  #     - db

  # Optional: Uncomment to run a database
  # db:
  #   image: mcr.microsoft.com/mssql/server:2019-latest
  #   container_name: almuthanna-db
  #   environment:
  #     - ACCEPT_EULA=Y
  #     - SA_PASSWORD=YourPassword123
  #   ports:
  #     - "1433:1433"
  #   networks:
  #     - inventory-network

networks:
  inventory-network:
    driver: bridge
