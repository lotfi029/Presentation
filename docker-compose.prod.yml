# Docker Compose for Production
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-app-prod
    image: inventory-app:latest
    restart: always
    ports:
      - "80:80"
      # Uncomment for HTTPS with reverse proxy
      # - "443:443"
    environment:
      # API base URL - Set to your production API server
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.almuthanna.com}
      NODE_ENV: production
    networks:
      - inventory-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "app.description=AlMuthannaPrecast Inventory Management"
      - "app.version=1.0.0"

  # Optional: Uncomment to use Nginx as reverse proxy for HTTPS
  # nginx-proxy:
  #   image: nginx:alpine
  #   container_name: inventory-nginx-proxy
  #   restart: always
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx-proxy.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - app
  #   networks:
  #     - inventory-network

networks:
  inventory-network:
    driver: bridge
