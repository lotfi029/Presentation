# Nginx configuration for serving React SPA
# This configuration is used in the Docker image

# Run as daemon off (for Docker)
daemon off;

# Worker processes
worker_processes auto;

# Error log
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;

    # Rate limiting (optional)
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    # Upstream API (if proxying)
    # upstream api {
    #     server api:3000;
    # }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Root directory for React app
        root /usr/share/nginx/html;
        index index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Proxy API requests to backend (optional)
        # location /api/ {
        #     proxy_pass http://api;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_connect_timeout 60s;
        #     proxy_send_timeout 60s;
        #     proxy_read_timeout 60s;
        # }

        # SPA routing: all non-file routes go to index.html
        location / {
            # Try to serve the file, or fall back to index.html
            try_files $uri $uri/ /index.html;
            
            # Cache control for index.html
            expires -1;
            add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        }

        # Health check endpoint for Docker
        location /health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
            access_log off;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

        # Error pages
        error_page 404 /index.html;
    }
}
